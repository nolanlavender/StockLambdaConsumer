AWSTemplateFormatVersion: '2010-09-09'
Description: 'Stock Lambda Consumer - ECS/Fargate Deployment with Market Hours Scheduling'

Parameters:
  KinesisStreamName:
    Type: String
    Default: stock-prices-stream
    Description: Name of the Kinesis Data Stream to consume from

  KinesisStreamArn:
    Type: String
    Description: ARN of the Kinesis Data Stream to consume from

  DynamoDBTableName:
    Type: String
    Default: stock-analytics
    Description: Name of the DynamoDB table for storing analytics

  DataRetentionDays:
    Type: Number
    Default: 7
    Description: Number of days to retain data in DynamoDB (TTL)
    MinValue: 1
    MaxValue: 30

  EnforceMarketHours:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Whether to enforce market hours

  TestMode:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable test mode to bypass market hours check

  ContainerCpu:
    Type: Number
    Default: 512
    Description: CPU units for Fargate task (256, 512, 1024, 2048, 4096)
    AllowedValues: [256, 512, 1024, 2048, 4096]

  ContainerMemory:
    Type: Number
    Default: 1024
    Description: Memory (MB) for Fargate task
    AllowedValues: [512, 1024, 2048, 3072, 4096, 5120, 6144, 7168, 8192]

Resources:
  # S3 Bucket for State Persistence
  StateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-state-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldStates
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Application
          Value: StockECSConsumer
        - Key: Environment
          Value: Production

  # DynamoDB Table for Stock Analytics (reused from Lambda version)
  StockAnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: symbol
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: symbol
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DateIndex
          KeySchema:
            - AttributeName: symbol
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: StockECSConsumer
        - Key: Environment
          Value: Production

  # ECR Repository for Container Image
  ECSRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-consumer'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Application
          Value: StockECSConsumer

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Application
          Value: StockECSConsumer

  # CloudWatch Log Group
  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}-consumer'
      RetentionInDays: 7

  # IAM Role for ECS Task Execution (pulls image, writes logs)
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Application
          Value: StockECSConsumer

  # IAM Role for ECS Task (application permissions)
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KinesisAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:DescribeStream
                  - kinesis:ListStreams
                  - kinesis:ListShards
                Resource: !Ref KinesisStreamArn
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt StockAnalyticsTable.Arn
                  - !Sub '${StockAnalyticsTable.Arn}/index/*'
        - PolicyName: S3StateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub '${StateBucket.Arn}/*'
      Tags:
        - Key: Application
          Value: StockECSConsumer

  # ECS Task Definition
  ConsumerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-consumer'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: consumer
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECSRepository}:latest'
          Essential: true
          Environment:
            - Name: KINESIS_STREAM_NAME
              Value: !Ref KinesisStreamName
            - Name: DYNAMODB_TABLE_NAME
              Value: !Ref DynamoDBTableName
            - Name: DATA_RETENTION_DAYS
              Value: !Ref DataRetentionDays
            - Name: ENFORCE_MARKET_HOURS
              Value: !Ref EnforceMarketHours
            - Name: TEST_MODE
              Value: !Ref TestMode
            - Name: STATE_BUCKET
              Value: !Ref StateBucket
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ConsumerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: consumer
      Tags:
        - Key: Application
          Value: StockECSConsumer

  # Security Group for ECS Tasks
  ConsumerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for stock consumer ECS tasks
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-consumer-sg'
        - Key: Application
          Value: StockECSConsumer

  # VPC (using default VPC for simplicity - could be parameterized)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-2'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rt'

  Route:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  # ECS Service
  ConsumerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-consumer-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ConsumerTaskDefinition
      DesiredCount: 0  # Start at 0, scheduler will set to 1 during market hours
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ConsumerSecurityGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      Tags:
        - Key: Application
          Value: StockECSConsumer

  # IAM Role for EventBridge Scheduler
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UpdateECSService
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ECSCluster}/${AWS::StackName}-consumer-service'

  # EventBridge Scheduler - Start consumer at 9:15 AM ET
  StartSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${AWS::StackName}-start'
      Description: Start consumer 15 minutes before market open (9:15 AM ET)
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: 'cron(15 13 ? * MON-FRI *)'  # 9:15 AM ET = 1:15 PM UTC (adjusted for EST)
      ScheduleExpressionTimezone: America/New_York
      Target:
        Arn: !Sub 'arn:aws:scheduler:::aws-sdk:ecs:updateService'
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: !Sub |
          {
            "Cluster": "${ECSCluster}",
            "Service": "${AWS::StackName}-consumer-service",
            "DesiredCount": 1
          }

  # EventBridge Scheduler - Stop consumer at 4:15 PM ET
  StopSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${AWS::StackName}-stop'
      Description: Stop consumer 15 minutes after market close (4:15 PM ET)
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: 'cron(15 20 ? * MON-FRI *)'  # 4:15 PM ET = 8:15 PM UTC (adjusted for EST)
      ScheduleExpressionTimezone: America/New_York
      Target:
        Arn: !Sub 'arn:aws:scheduler:::aws-sdk:ecs:updateService'
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: !Sub |
          {
            "Cluster": "${ECSCluster}",
            "Service": "${AWS::StackName}-consumer-service",
            "DesiredCount": 0
          }

Outputs:
  ECSClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-ClusterName'

  ECSServiceName:
    Description: ECS Service Name
    Value: !GetAtt ConsumerService.Name
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'

  ECRRepositoryUri:
    Description: ECR Repository URI
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECSRepository}'
    Export:
      Name: !Sub '${AWS::StackName}-ECRUri'

  StateBucketName:
    Description: S3 Bucket for State Persistence
    Value: !Ref StateBucket
    Export:
      Name: !Sub '${AWS::StackName}-StateBucket'

  DynamoDBTableName:
    Description: DynamoDB Table Name for Stock Analytics
    Value: !Ref StockAnalyticsTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  LogGroupName:
    Description: CloudWatch Log Group Name
    Value: !Ref ConsumerLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroup'
