AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Stock Lambda Consumer - Real-time stock analytics processor'

Parameters:
  KinesisStreamName:
    Type: String
    Default: stock-prices-stream
    Description: Name of the Kinesis Data Stream to consume from

  KinesisStreamArn:
    Type: String
    Description: ARN of the Kinesis Data Stream to consume from

  DynamoDBTableName:
    Type: String
    Default: stock-analytics
    Description: Name of the DynamoDB table for storing analytics

  DataRetentionDays:
    Type: Number
    Default: 7
    Description: Number of days to retain data in DynamoDB (TTL)
    MinValue: 1
    MaxValue: 30

  EnforceMarketHours:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Whether to enforce market hours for auto-shutdown

  TestMode:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable test mode to bypass market hours check

  NoDataTimeoutMinutes:
    Type: Number
    Default: 10
    Description: Minutes of no data before auto-shutdown
    MinValue: 5
    MaxValue: 60

  CheckIntervalMinutes:
    Type: Number
    Default: 5
    Description: How often to check for auto-shutdown (in minutes)
    MinValue: 1
    MaxValue: 15

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
        DATA_RETENTION_DAYS: !Ref DataRetentionDays
        ENFORCE_MARKET_HOURS: !Ref EnforceMarketHours
        TEST_MODE: !Ref TestMode

Resources:
  # DynamoDB Table for Stock Analytics
  StockAnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: symbol
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: symbol
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DateIndex
          KeySchema:
            - AttributeName: symbol
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: StockLambdaConsumer
        - Key: Environment
          Value: Production

  # Main Lambda Function - Kinesis Consumer
  StockAnalyticsProcessor:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: lambda_function.lambda_handler
      Description: Processes stock prices from Kinesis and generates analytics
      Environment:
        Variables:
          KINESIS_STREAM_NAME: !Ref KinesisStreamName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt StockAnalyticsTable.Arn
                - !Sub '${StockAnalyticsTable.Arn}/index/*'
            - Effect: Allow
              Action:
                - kinesis:GetRecords
                - kinesis:GetShardIterator
                - kinesis:DescribeStream
                - kinesis:ListStreams
                - kinesis:ListShards
              Resource: !Ref KinesisStreamArn
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
      Events:
        KinesisEvent:
          Type: Kinesis
          Properties:
            Stream: !Ref KinesisStreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
            ParallelizationFactor: 1
            MaximumRecordAgeInSeconds: 3600

  # Monitor Lambda - Auto-shutdown mechanism
  StockAnalyticsMonitor:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: monitor.lambda_handler
      Description: Monitors data flow and disables consumer if no data or outside market hours
      Environment:
        Variables:
          CONSUMER_FUNCTION_NAME: !Ref StockAnalyticsProcessor
          EVENT_SOURCE_UUID: !Ref StockAnalyticsProcessorKinesisEvent
          NO_DATA_TIMEOUT_MINUTES: !Ref NoDataTimeoutMinutes
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt StockAnalyticsTable.Arn
                - !Sub '${StockAnalyticsTable.Arn}/index/*'
            - Effect: Allow
              Action:
                - lambda:GetFunctionConfiguration
                - lambda:ListEventSourceMappings
                - lambda:UpdateEventSourceMapping
              Resource: '*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'

  # EventBridge Rule - Periodic monitor check
  MonitorScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Periodically checks if consumer should be disabled
      ScheduleExpression: !Sub 'rate(${CheckIntervalMinutes} minutes)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt StockAnalyticsMonitor.Arn
          Id: MonitorTarget

  # Permission for EventBridge to invoke Monitor Lambda
  MonitorSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StockAnalyticsMonitor
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonitorScheduleRule.Arn

  # CloudWatch Log Groups
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StockAnalyticsProcessor}'
      RetentionInDays: 7

  MonitorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StockAnalyticsMonitor}'
      RetentionInDays: 7

  # CloudWatch Alarms
  ProcessorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-processor-errors'
      AlarmDescription: Alert when processor function has errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref StockAnalyticsProcessor
      TreatMissingData: notBreaching

  ProcessorThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-processor-throttles'
      AlarmDescription: Alert when processor function is throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref StockAnalyticsProcessor
      TreatMissingData: notBreaching

Outputs:
  StockAnalyticsProcessorArn:
    Description: Stock Analytics Processor Lambda Function ARN
    Value: !GetAtt StockAnalyticsProcessor.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ProcessorArn'

  StockAnalyticsMonitorArn:
    Description: Stock Analytics Monitor Lambda Function ARN
    Value: !GetAtt StockAnalyticsMonitor.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MonitorArn'

  DynamoDBTableName:
    Description: DynamoDB Table Name for Stock Analytics
    Value: !Ref StockAnalyticsTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  DynamoDBTableArn:
    Description: DynamoDB Table ARN for Stock Analytics
    Value: !GetAtt StockAnalyticsTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'

  KinesisEventSourceMapping:
    Description: UUID of the Kinesis Event Source Mapping
    Value: !Ref StockAnalyticsProcessorKinesisEvent
    Export:
      Name: !Sub '${AWS::StackName}-EventSourceUUID'
